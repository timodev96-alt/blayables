<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe — Blayables</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html">
      <span class="brand__mark">M/A</span>
      <span class="brand__name">Blayables</span>
    </a>
    <nav class="site-nav">
      <a href="../index.html">Games</a>
    </nav>
  </header>

  <main>
    <div class="game-header">
      <a class="back-link" href="../index.html">← Back to games</a>
      <span class="pill pill--live">2 players, same screen</span>
    </div>

    <section class="game-panel">
      <div class="game-status-row">
        <span id="ttt-status">X goes first</span>
        <span id="ttt-score">X: 0 · O: 0 · Draws: 0</span>
      </div>

      <div class="ttt-board" id="ttt-board" role="grid" aria-label="Tic-tac-toe board"></div>

      <div class="ttt-actions">
        <button class="btn" id="ttt-reset">New round</button>
        <button class="btn btn--ghost" id="ttt-reset-score">Reset score</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Blayables</span>
    <span>Tic-Tac-Toe</span>
  </footer>

  <script src="../assets/js/tic-tac-toe.js"></script>
</body>
</html>
